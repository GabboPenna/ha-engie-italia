[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-engie-italia"
version = "0.1.0b11"
description = "Read-only ENGIE Italia integration and client for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gabriele Pennacchia"}]
dependencies = ["aiohttp>=3.14.3,<4", "PyJWT[crypto]>=2.13.0,<3", "tzdata>=2026.4; sys_platform == 'win32'"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["ruff==0.16.3", "tzdata==2026.4"]
browser = ["playwright==1.61.0"]

[project.urls]
Repository = "https://github.com/GabboPenna/ha-engie-italia"
Issues = "https://github.com/GabboPenna/ha-engie-italia/issues"

[tool.setuptools]
packages = ["engie_italia"]
package-dir = {engie_italia = "custom_components/engie_italia/api"}

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["engie_italia", "custom_components", "tools"]
